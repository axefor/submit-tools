# Project settings for submit-array: VASP calculations in the subfolders of
# each task folder, run until a convergence check passes. Copy as submit.conf
# to the project folder and run, e.g.,
#   submit-array tasks.txt
# Sourced at submission after the cluster settings and any submit.conf in
# parent folders; CONF_DIR is this file's folder. Hooks run later via
# `bash -c`: single-quote what must expand then, double-quote what must not.

SCHED_ARGS+=(-t 24:00:00)
SETUP+='
module load VASP_MODULE
'

# vasp/ on PATH, or a project copy: RUN_CMD="bash $CONF_DIR/vasp_prerun.sh"
RUN_CMD=vasp_prerun.sh
DONE_CMD='grep -qs "General timing and accounting" OUTCAR'
CALC_MARKER=INCAR

# Runs in the task folder; exit 0 = converged, stop.
CONVERGED_CMD="$CONF_DIR/check_converged.sh"

# Runs in the task folder when all its calculations are done; writes the next
# calculation folder(s), or nothing when there are no more.
NEXT_CMD="$CONF_DIR/write_next.sh"

MAX_FAILS=3
