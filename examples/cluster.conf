# Cluster settings for submit / submit-array. Copy to
# ~/.config/submit-tools/cluster.conf on each cluster and replace the
# placeholders. Bash, sourced at submission; project settings override it.

# Arguments for every job: account and a default walltime
SCHED_ARGS=(-A ACCOUNT -t 01:00:00)

# Shell code run in every job before the command
SETUP='
module load MODULE
'

# Resource profiles, chosen with -P NAME. Each appends to SCHED_ARGS; the
# project's SCHED_ARGS and -t / -x come after it, so they win.
profile_node() {
    SCHED_ARGS+=(-p PARTITION -N 1 --ntasks-per-node=CORES_PER_NODE)
}
profile_small() {
    SCHED_ARGS+=(-p SHARED_PARTITION -n 4)
}
DEFAULT_PROFILE=node

